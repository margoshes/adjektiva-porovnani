    .table-wrap {

    .pair h3 { margin: 0 0 8px; font-size: 1.04rem; color: #0b434d; }
    .pair p { margin: 7px 0; color: #4e5d5a; }
    .pill { display: inline-block; margin: 3px 4px 3px 0; padding: 3px 9px; border-radius: 999px; background: #e5eeee; color: #174b53; font-size: .85rem; }
    .footer { margin-top: 23px; padding: 17px 19px; border: 1px solid #d9aa96; border-radius: 15px; background: rgba(255, 249, 245, .90); color: #505b57; font-size: .9rem; }
    .footer a { color: #0b5965; text-decoration-thickness: 1px; text-underline-offset: 2px; }
    .footer ul { margin: 8px 0 0; padding-left: 19px; }
    .footer li { margin: 4px 0; }
    .small { color: #5e6b67; font-size: .9rem; }
    .hidden { display: none !important; }
    @media (max-width: 820px) {

      .lang-switch { align-self: flex-end; }

      .pair-grid { grid-template-columns: 1fr; }
      .tabs-shell { padding: 0 9px; }
      .tab { padding: 11px 14px 10px; }
    }
    @media (max-width: 520px) {
      .page { width: min(100% - 18px, 1220px); margin-top: 9px; }

      .book-mark { flex-basis: 45px; width: 45px; height: 45px; font-size: 24px; border-radius: 12px; }

    }
  </style>
</head>

        passiveDistTitle: 'Krátký a dlouhý tvar v češtině',
        passiveDist: '<div class="pair-grid"><div class="pair"><h3>Pasivní přísudek: krátký tvar</h3><p class="form">Dům byl postaven architektem Petrem Macinkou.</p><p>Будинок був збудований архітектором Петром Мацінкою.</p><p class="small">postaven — krátký tvar příčestí trpného v konstrukci opisného pasiva.</p></div><div class="pair"><h3>Přívlastek: dlouhý tvar</h3><p class="form">Postavený dům stojí na náměstí.</p><p>Збудований будинок стоїть на площі.</p><p class="small">postavený — adjektivní tvar, shoduje se s podstatným jménem: postavený dům, postavená budova, postavené město.</p></div></div>',
        passiveNote: 'Srovnejte: „Dům byl postaven“ (krátký tvar v pasivním přísudku) a „postavený dům“ (dlouhý adjektivní tvar). V ukrajinštině se v obou kontextech může objevit forma „збудований“, ale její syntaktická funkce je odlišná.',
        nuancesIntro: 'Ne každé adjektivum související s dějem je příčestí. Je třeba rozlišovat slovesná adjektiva od běžných adjektiv odvozených od podstatných jmen a zohlednit také ustálené významy a kontext.',

          ['zhaslé × zhasnuté','<p><span class="form">zhaslé světlo</span> — <strong>згасле світло</strong>: světlo zhaslo.</p><p><span class="form">zhasnuté světlo</span> — <strong>вимкнене світло</strong>: někdo světlo zhasl.</p><p>Rozlišení je užitečné, ale v běžném užívání se významy mohou částečně překrývat.</p>'],
          ['opadlé / opadané × osypané','<p><span class="form">opadlé listí / opadané listí</span> — <strong>опале листя</strong>.</p><p><span class="form">osypané</span> obvykle znamená „posypané / pokryté něčím“ nebo „obsypané“ v jiném kontextu; není to běžný ekvivalent pro „опале листя“.</p>'],

        lPartTitle: 'Nezaměňujte slovesný tvar minulého času s adjektivem',
        lPartRows: [
          ['Світло згасло.','Světlo zhaslo.','zhaslo — slovesný tvar minulého času.'],

          ['Він працював.','Pracoval.','pracoval — slovesný tvar minulého času.'],
          ['Людина, яка працює.','Pracující člověk.','pracující — slovesné adjektivum na -cí.'],
          ['Виконане завдання.','Udělaný úkol.','udělaný — trpné slovesné adjektivum.']
        ],
        tipsIntro: 'Několik otázek pomůže určit typ tvaru a zvolit přirozený ekvivalent.',
        tips: [
          ['1. Vykonal předmět děj sám nebo se sám změnil?','Hledejte činný význam: opadlé listí — listí, které opadlo; zhaslé světlo — světlo, které zhaslo.'],
          ['2. Působil někdo dějem na daný předmět?','Hledejte trpný význam: napsaný dopis — dopis, který někdo napsal; napsaný dopis.'],
          ['3. Označuje tvar toho, kdo vykonává děj?','V češtině je často možné adjektivum na -cí: pracující člověk, studující osoba. V ukrajinštině bývá přirozenější opis „людина, яка працює / навчається“.'],
          ['4. Vyjadřuje adjektivum pouze vztah k určité oblasti?','Může jít o běžné adjektivum od podstatného jména: studijní program — навчальна програма.'],
          ['5. Lze koncovku přenést mechanicky?','Ne. Vždy porovnávejte význam, původ a běžnost daného tvaru v každém jazyce zvlášť.']

        tipsBottom: '<strong>Hlavní doporučení:</strong> nejprve určete, zda tvar označuje původce děje, výsledek samostatné změny, objekt děje, nebo pouze vztah k určité oblasti. Teprve potom hledejte ekvivalent v druhém jazyce.'
      }
    };

    let currentLang = 'uk';
    let currentTab = 'overview';
    const $ = (selector, root = document) => root.querySelector(selector);
    const esc = (s) => String(s).replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));

    function table(headers, rows) {
      return `<div class="table-wrap"><table><thead><tr>${headers.map(h => `<th>${h}</th>`).join('')}</tr></thead><tbody>${rows.map(row => `<tr>${row.map(cell => `<td>${cell}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
    }
    function cardGrid(cards) {
      return `<div class="cards">${cards.map(([tone,title,body]) => `<section class="card ${tone}"><h3>${title}</h3>${body}</section>`).join('')}</div>`;
    }
    function pairedTable(rows, labels) {
      return table([labels.ua, labels.cz, labels.formation, labels.examples], rows.map(r => [
        `<span class="form">${r[0]}</span>`, `<span class="form">${r[1]}</span>`, r[2] + '<br><span class="sub">' + r[3] + '</span>', r[4]
      ]));
    }
    function renderOverview(d) {
      return `<div class="intro">${d.overviewIntro}</div>
        <h2 class="section-title">${d.overviewTitle}</h2><p class="section-lead">${d.overviewLead}</p>
        ${table([d.labels.concept,d.labels.ua,d.labels.cz,d.labels.role,d.labels.formation,d.labels.examples], d.overviewRows.map(r => [r[0],r[1],r[2],r[3],r[4],r[5]]))}
        ${cardGrid(d.overviewCards)}`;
    }
    function renderActive(d) {
      const formRows = d.formationRows.map(r => [r[0],r[1],`<span class="form">${r[2]}</span>`,r[3]]);
      return `<div class="intro">${d.activeIntro}</div>
        <h2 class="section-title">${d.activePastTitle}</h2><p class="section-lead">${d.activePastLead}</p>
        ${pairedTable(d.activePastRows, d.labels)}
        <div class="note">${d.activePastNote}</div>
        <h2 class="section-title">${d.activePresentTitle}</h2><p class="section-lead">${d.activePresentLead}</p>
        ${pairedTable(d.activePresentRows, d.labels)}
        <h2 class="section-title">${d.formationTitle}</h2><p class="section-lead">${d.formationLead}</p>
        ${table([d.labels.verb,d.labels.present,d.labels.form,d.labels.uaEquivalent], formRows)}
        <div class="note">${d.activePresentNote}</div>`;
    }
    function renderPassive(d) {
      return `<div class="intro">${d.passiveIntro}</div>
        <h2 class="section-title">${d.passiveTitle}</h2><p class="section-lead">${d.passiveLead}</p>
        ${pairedTable(d.passiveRows, d.labels)}
        <h2 class="section-title">${d.passiveDistTitle}</h2>
        ${d.passiveDist}
        <div class="note">${d.passiveNote}</div>`;
    }
    function renderNuances(d) {
      const cards = d.nuanceCards.map((item,i) => `<section class="pair"><h3>${item[0]}</h3>${item[1]}</section>`).join('');
      return `<div class="intro">${d.nuancesIntro}</div><h2 class="section-title">${d.nuancesTitle}</h2>
        <div class="pair-grid">${cards}</div>
        <h2 class="section-title">${d.lPartTitle}</h2>
        ${table([d.labels.ua,d.labels.cz,d.labels.role],d.lPartRows)}
        <div class="note">Порівняння показує, чому форма дієслова минулого часу й прикметникова форма не є взаємозамінними.</div>`;
    }
    function renderTips(d) {
      return `<div class="intro">${d.tipsIntro}</div>
        <div class="cards">${d.tips.map((tip,i) => `<section class="card ${i%2===0?'blue':'green'}"><h3>${tip[0]}</h3><p>${tip[1]}</p></section>`).join('')}</div>
        <div class="note">${d.tipsBottom}</div>`;
    }
    function render() {
      const d = words[currentLang];
      document.documentElement.lang = currentLang;
      document.title = d.title;
      document.querySelector('.lang-switch').setAttribute('aria-label', currentLang === 'uk' ? 'Мова інтерфейсу' : 'Jazyk rozhraní');
      $('#pageTitle').textContent = d.title;
      $('#pageSubtitle').textContent = d.subtitle;
      Object.keys(d.tabs).forEach(key => { $(`[data-tab-label="${key}"]`).textContent = d.tabs[key]; });
      document.querySelectorAll('[data-lang]').forEach(btn => btn.setAttribute('aria-pressed', String(btn.dataset.lang === currentLang)));
      document.querySelectorAll('[data-tab]').forEach(btn => {
        const selected = btn.dataset.tab === currentTab;
        btn.setAttribute('aria-selected', String(selected));
        btn.tabIndex = selected ? 0 : -1;
      });
      const renderers = { overview: renderOverview, active: renderActive, passive: renderPassive, nuances: renderNuances, tips: renderTips };
      $('#panel').innerHTML = renderers[currentTab](d);
      $('#panel').setAttribute('aria-labelledby', `tab-${currentTab}`);
      $('#sources').innerHTML = `<strong>${d.labels.source}</strong>${d.sources.replace(/^<strong>.*?<\/strong>/,'')}`;
    }
    document.querySelectorAll('[data-lang]').forEach(btn => btn.addEventListener('click', () => { currentLang = btn.dataset.lang; render(); }));
    document.querySelectorAll('[data-tab]').forEach(btn => btn.addEventListener('click', () => { currentTab = btn.dataset.tab; render(); }));
    document.querySelector('.tabs').addEventListener('keydown', e => {
      if (!['ArrowLeft','ArrowRight','Home','End'].includes(e.key)) return;
      const tabs = [...document.querySelectorAll('[data-tab]')];
      let idx = tabs.findIndex(t => t.dataset.tab === currentTab);
      if (e.key === 'ArrowRight') idx = (idx + 1) % tabs.length;
      if (e.key === 'ArrowLeft') idx = (idx - 1 + tabs.length) % tabs.length;
      if (e.key === 'Home') idx = 0;
      if (e.key === 'End') idx = tabs.length - 1;
      currentTab = tabs[idx].dataset.tab; render(); tabs[idx].focus();
    });
    function notifyParentHeight() {
      if (window.parent === window) return;
      const height = Math.ceil(document.documentElement.scrollHeight);
      window.parent.postMessage({ type: 'ua-cz-verbalni-pridavky:height', height }, '*');
    }
    if ('ResizeObserver' in window) {
      new ResizeObserver(() => requestAnimationFrame(notifyParentHeight)).observe(document.body);
    }
    window.addEventListener('load', notifyParentHeight);
    window.addEventListener('resize', notifyParentHeight);
    render();
    requestAnimationFrame(notifyParentHeight);
  </script>
